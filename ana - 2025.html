      function populateClientList() {
        filterClients();
      }

      function filterClients() {
        let searchInput = document
          .getElementById("searchClient")
          .value.toLowerCase();
        let clientList = document.getElementById("clientList");
        clientList.innerHTML = "";
        let hasResults = false;

        for (let client in clients) {
          if (client.toLowerCase().includes(searchInput)) {
            let div = document.createElement("div");
            div.textContent = client;
            div.className = "client-item";
            div.onclick = function () {
              selectClient(client);
            };
            clientList.appendChild(div);
            hasResults = true;
          }
        }
        clientList.style.display = hasResults ? "block" : "none";
      }

      function selectClient(client) {
        document.getElementById("searchClient").value = client;
        document.getElementById("clientList").style.display = "none";
        showMessage(client);
      }

      function showMessage(client) {
        let messageBox = document.getElementById("messageBox");
        let messageText = document.getElementById("messageText");

        if (clients[client]) {
          messageText.textContent = clients[client];
          messageBox.style.display = "block";
        }
      }

      function copyMessage() {
        let messageText = document.getElementById("messageText").textContent;
        navigator.clipboard.writeText(messageText).then(() => {});
      }

      function copyFixedMessage(message) {
        navigator.clipboard.writeText(message).then(() => {});
      }

      document.addEventListener("DOMContentLoaded", populateClientList);
